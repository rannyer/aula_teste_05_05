name: Test - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Rodar testes
        run: mvn test